# ==============================================================================
# GitLab CI/CD Pipeline - POC Miniplatform Livin' (Livin' Village)
# High-Performance BuildKit Rootless + Kubernetes Rollout (k3s)
# ==============================================================================

default:
  tags:
    - k3s

stages:
  - build
  - deploy

variables:
  INTERNAL_REGISTRY: "docker-registry.infra.svc.cluster.local:5000"
  IMAGE_NAME: "poc-miniplatform-livin"
  BUILDKITD_FLAGS: "--oci-worker-no-process-sandbox"

# ------------------------------------------------------------------------------
# Reusable BuildKit Rootless Template
# ------------------------------------------------------------------------------
.buildkit_template:
  stage: build
  image:
    name: moby/buildkit:rootless
    entrypoint: [""]
  before_script:
    - mkdir -p ~/.config/buildkit
    - |
      cat <<EOF > ~/.config/buildkit/buildkitd.toml
      [registry."${INTERNAL_REGISTRY}"]
        http = true
        insecure = true

      [registry."docker-registry.infra:5000"]
        http = true
        insecure = true
      EOF

# ------------------------------------------------------------------------------
# 1. BUILD APP (Vue 3 SPA + Golang Backend Single Image)
# ------------------------------------------------------------------------------
build-backend:
  extends: .buildkit_template
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(dev|main|master)$/'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'
  script:
    - echo "=================================================="
    - echo "Building & Pushing Backend+Web Image via BuildKit"
    - echo "=================================================="
    - |
      EXTRA_TAG=""
      if [ -n "${CI_COMMIT_TAG}" ]; then
        EXTRA_TAG=",${INTERNAL_REGISTRY}/${IMAGE_NAME}:${CI_COMMIT_TAG}"
      fi
      buildctl-daemonless.sh build \
        --frontend=dockerfile.v0 \
        --local context=. \
        --local dockerfile=backend \
        --output "type=image,\"name=${INTERNAL_REGISTRY}/${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA},${INTERNAL_REGISTRY}/${IMAGE_NAME}:latest${EXTRA_TAG}\",push=true,registry.insecure=true" \
        --export-cache type=registry,ref=${INTERNAL_REGISTRY}/${IMAGE_NAME}-cache,mode=max,registry.insecure=true \
        --import-cache type=registry,ref=${INTERNAL_REGISTRY}/${IMAGE_NAME}-cache
    - echo "Docker image built and pushed to internal registry!"

# ------------------------------------------------------------------------------
# 2. DEPLOY DEVELOPMENT (Automatic on branch: dev/main -> Namespace: gacha-poc)
# ------------------------------------------------------------------------------
deploy-dev:
  stage: deploy
  image: bitnami/kubectl:latest
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(dev|main|master)$/'
  needs:
    - job: build-backend
  script:
    - echo "=================================================="
    - echo "Deploying to k3s (namespace gacha-poc)"
    - echo "=================================================="
    - 'echo "Setting Atomic Image Tag: ${CI_COMMIT_SHORT_SHA}"'
    - 'sed -i "s|newTag: .*|newTag: \"${CI_COMMIT_SHORT_SHA}\"|g" deploy/k3s/kustomization.yaml'
    - kubectl apply -k deploy/k3s
    - echo "Waiting for rollout..."
    - kubectl rollout status deployment/gacha-poc-backend -n gacha-poc --timeout=180s
    - echo "Pod & Service Status in gacha-poc"
    - kubectl get pods,svc -l app=gacha-poc-backend -n gacha-poc -o wide
    - echo "Deployment completed successfully!"

# ------------------------------------------------------------------------------
# 3. DEPLOY PRODUCTION (Manual trigger strictly on git tag -> Namespace: gacha-poc)
# ------------------------------------------------------------------------------
deploy-prod:
  stage: deploy
  image: bitnami/kubectl:latest
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
  needs:
    - job: build-backend
  script:
    - echo "=================================================="
    - 'echo "Deploying to Production (gacha-poc) [TAG: ${CI_COMMIT_TAG}]"'
    - echo "=================================================="
    - 'echo "Setting Atomic Image Tag: ${CI_COMMIT_SHORT_SHA}"'
    - 'sed -i "s|newTag: .*|newTag: \"${CI_COMMIT_SHORT_SHA}\"|g" deploy/k3s/kustomization.yaml'
    - kubectl apply -k deploy/k3s
    - echo "Waiting for rollout..."
    - kubectl rollout status deployment/gacha-poc-backend -n gacha-poc --timeout=180s
    - echo "Pod & Service Status in gacha-poc"
    - kubectl get pods,svc -l app=gacha-poc-backend -n gacha-poc -o wide
    - echo "Production deployment completed successfully!"
