apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gacha-poc-backend
  namespace: gacha-poc
  labels:
    app: gacha-poc-backend
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: gacha-poc-backend
      port:
        number: 8080
  tls:
    - hosts:
        - gacha-poc
