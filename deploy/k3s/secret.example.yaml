# Salin ke secret.yaml (jangan commit secret asli) atau buat langsung via kubectl dari .env:
# kubectl -n gacha-poc create secret generic gacha-poc-secrets \
#   --from-literal=database-url="postgres://gacha:<PASSWORD>@<POSTGRES_HOST>:5432/gacha_poc?sslmode=disable" \
#   --from-literal=jwt-secret="<MIN_32_CHAR_RANDOM_SECRET>"
apiVersion: v1
kind: Secret
metadata:
  name: gacha-poc-secrets
  namespace: gacha-poc
type: Opaque
stringData:
  database-url: "postgres://gacha:CHANGE_ME@postgres.gacha-poc.svc.cluster.local:5432/gacha_poc?sslmode=disable"
  jwt-secret: "change-this-k3s-jwt-secret-minimum-32-characters"
